name: checks
# Keyless checks a judge can rerun: types, guard attacks, and the committed evidence.
# No API key is configured here, so nothing in this workflow can call a model.
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run setup:data
      - run: npm run typecheck
      - run: npm run test:guards
      - run: npm run verify:evidence
      - name: Committed replay file is current
        run: git diff --exit-code docs/evidence/critic-eval-hard/replay.md docs/evidence/critic-eval-hard/replay.json
