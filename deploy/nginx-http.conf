# EINSTEIN Matchmaker demo. Reachable only over WireGuard: the hostname resolves to
# 10.66.0.1 for clients using the VPN DNS resolver; public requests get a 404.
# The public :80 block exists so Let's Encrypt (http-01) can issue and renew the certificate.
server {
    listen 80;
    server_name einstein.jamilxt.com;
    server_tokens off;
    location / { return 404; }
}

server {
    listen 10.66.0.1:80;
    server_name einstein.jamilxt.com;
    allow 10.66.0.0/24;
    deny all;
    return 301 https://$host$request_uri;
}
