# EINSTEIN Matchmaker demo. Public replay-only site through Cloudflare; the hostname resolves to
# 10.66.0.1 for VPN clients, who also get capped live search.
server {
    listen 80;
    server_name einstein.jamilxt.com;
    server_tokens off;
    # Cloudflare (Flexible SSL) reaches the origin on :80, so the public replay site is served here too.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location = /api/search { return 403; }
    location /api/stream/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Einstein-Access public;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Einstein-Access public;
        proxy_read_timeout 120s;
    }
}

server {
    listen 10.66.0.1:80;
    server_name einstein.jamilxt.com;
    allow 10.66.0.0/24;
    deny all;
    return 301 https://$host$request_uri;
}
