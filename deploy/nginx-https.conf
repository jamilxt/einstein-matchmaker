
server {
    listen 443 ssl;
    server_name einstein.jamilxt.com;
    ssl_certificate /etc/letsencrypt/live/einstein.jamilxt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/einstein.jamilxt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / { return 404; }
}

server {
    listen 10.66.0.1:443 ssl;
    server_name einstein.jamilxt.com;
    allow 10.66.0.0/24;
    deny all;
    ssl_certificate /etc/letsencrypt/live/einstein.jamilxt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/einstein.jamilxt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location /api/stream/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
